name: API

# Runs on every PR (including PRs stacked on other branches) and on pushes to main.
on:
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]

# Cancel superseded PR checks. Let any active staging rollout finish.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_manager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_manager_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image starts and migrates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_manager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rollcall-api:ci .
      - name: Run the image against an empty database
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production -e PORT=3000 -e JWT_SECRET=ci-secret \
            -e DATABASE_URL=postgresql://exam:exam@localhost:5432/exam_manager \
            rollcall-api:ci
      - name: Wait for /ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:3000/ready; then echo; curl -sf localhost:3000/health; echo; exit 0; fi
            sleep 1
          done
          echo "API never became ready"; docker logs api; exit 1
      - if: always()
        run: docker logs api || true

  deploy:
    name: Deploy API to DOKS staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    env:
      REGISTRY: exam-manager-ece1779
      CLUSTER: exam-manager
      KUBECONFIG: ${{ runner.temp }}/exam-manager-kubeconfig.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: azure/setup-kubectl@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the registry
        run: doctl registry login --expiry-seconds 1200
      - name: Build and publish the API image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64
          provenance: false
          push: true
          tags: registry.digitalocean.com/exam-manager-ece1779/exam-manager-api:${{ github.sha }}
      - name: Update the staging Deployment
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          doctl kubernetes cluster kubeconfig save "$CLUSTER" --expiry-seconds 600
          image="registry.digitalocean.com/$REGISTRY/exam-manager-api@$IMAGE_DIGEST"
          kubectl -n exam-manager set image deployment/api api="$image"
          kubectl -n exam-manager rollout status deployment/api --timeout=5m
