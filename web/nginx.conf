server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Vite file names include a content hash, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path (e.g. /proctor) is handled by React Router.
  # index.html must not be cached, or users keep an old bundle after a deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
