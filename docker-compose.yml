# Local development: API + PostgreSQL + Redis
#   cp .env.example .env
#   docker compose up --build
# API on http://localhost:3000 (liveness: /health, readiness: /ready)
services:
  # The API, built from api/Dockerfile. Waits for Postgres to be healthy first.
  api:
    build: ./api
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Database. Data is kept in the pgdata volume between restarts.
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Shares live-update events between API replicas.
  redis:
    image: redis:7

volumes:
  pgdata:
