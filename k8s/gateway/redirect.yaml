# Redirect plain HTTP to HTTPS. Apply this only after the certificates are issued.
# cert-manager's temporary challenge routes match a more specific path
# (/.well-known/acme-challenge/<token>), so they still win over this catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: rollcall
      sectionName: http
  hostnames:
    - uoft-rollcall.duckdns.org
    - uoft-rollcall-api.duckdns.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
