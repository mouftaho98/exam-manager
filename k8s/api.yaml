apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: API_IMAGE
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: JWT_SECRET
            - name: WEB_URL
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: WEB_URL
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: CORS_ORIGIN
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            # No CPU limit: the HPA scales on CPU use relative to the request, and a
            # CPU limit would throttle pods during a check-in spike. The memory
            # limit stops a leak from taking the node down.
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
